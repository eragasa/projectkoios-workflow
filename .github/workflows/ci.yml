name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.14 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out workflow candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.25"
          python-version: "3.14"
          enable-cache: false

      - name: Synchronize locked workspace
        run: uv sync --locked --all-packages --all-extras

      - name: Check owned Python formatting
        run: >-
          .venv/bin/python -m ruff format --check
          src/python/projectkoios/workflow/core
          src/python/projectkoios/workflow/course_review
          src/python/projectkoios/workflow/persistence
          src/python/projectkoios/workflow/reference_review
          src/python/projectkoios/workflow/runtime
          tests/projectkoios/workflow/core
          tests/projectkoios/workflow/course_review
          tests/projectkoios/workflow/persistence
          tests/projectkoios/workflow/reference_review
          tests/projectkoios/workflow/runtime
          tests/test__ColoredPetriNetShadowProvenance.py
          tests/test__Ksdft2effmassColoredPetriNetConsumerParity.py
          sdk/src/python
          sdk/tests

      - name: Lint all Python
        run: .venv/bin/python -m ruff check src/python tests sdk/src/python sdk/tests

      - name: Type-check all production source
        run: |
          .venv/bin/python -m mypy src/python
          (cd sdk && ../.venv/bin/python -m mypy)

      - name: Run full test suites
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m pytest -q sdk/tests

      - name: Build source and wheel distributions
        run: uv build --all-packages --out-dir dist

      - name: Verify standalone SDK wheel license policy
        run: |
          .venv/bin/python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheels = tuple(
              Path("dist").glob(
                  "projectkoios_workflow_sdk-0.1.0a1-*.whl"
              )
          )
          assert len(wheels) == 1
          expected = Path("LICENSE").read_bytes()
          assert Path("sdk/LICENSE").read_bytes() == expected
          with ZipFile(wheels[0]) as wheel:
              licenses = tuple(
                  name
                  for name in wheel.namelist()
                  if name.endswith(".dist-info/licenses/LICENSE")
              )
              assert len(licenses) == 1
              assert wheel.read(licenses[0]) == expected
              metadata_name = next(
                  name
                  for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser().parsebytes(
                  wheel.read(metadata_name)
              )
              assert metadata["License-Expression"] == "Apache-2.0"
          PY

      - name: Verify clean wheel installation
        run: |
          uv venv /tmp/projectkoios-workflow-wheel --python 3.14 --clear
          uv pip install --python /tmp/projectkoios-workflow-wheel/bin/python dist/*.whl
          uv pip check --python /tmp/projectkoios-workflow-wheel/bin/python
          /tmp/projectkoios-workflow-wheel/bin/python -I - <<'PY'
          from projectkoios.workflow.course_review import CourseReviewWorkflow
          from projectkoios.workflow.persistence import SQLiteAtomicRevisionStore
          from projectkoios.workflow.reference_review import (
              IngestionClaimCandidateReference,
              ReferenceReviewWorkflow,
          )
          from projectkoios.workflow.runtime import LocalWorkflowRuntime
          from projectkoios.workflow_sdk import WORKFLOW_SDK_VERSION
          assert WORKFLOW_SDK_VERSION == "0.1.0a1"
          assert CourseReviewWorkflow is not None
          assert IngestionClaimCandidateReference is not None
          assert ReferenceReviewWorkflow is not None
          assert SQLiteAtomicRevisionStore is not None
          assert LocalWorkflowRuntime is not None
          PY

      - name: Check patch whitespace
        run: git diff --check HEAD
