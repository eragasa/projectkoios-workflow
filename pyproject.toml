[project]
name = "projectkoios-workflow"
version = "0.0.0"
description = "Reusable workflow semantics with an experimental colored-Petri-net shadow kernel"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "software_verification: implementation satisfies documented software contract",
]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/python/projectkoios/workflow/petrinet/colored/*.py" = ["E501", "I001"]
"tests/projectkoios/workflow/petrinet/colored/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
mypy_path = "src/python"
namespace_packages = true
explicit_package_bases = true
files = ["src/python"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
