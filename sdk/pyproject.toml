[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "projectkoios-workflow-sdk"
version = "0.1.0a1"
description = "Consumer integration SDK for the Project Koios CPN workflow platform"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["projectkoios.workflow_sdk", "projectkoios.workflow_sdk.*"]
namespaces = true

[tool.setuptools.package-data]
"projectkoios.workflow_sdk" = ["py.typed"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16", "mypy>=2.0", "build>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
mypy_path = "src/python"
files = ["src/python", "tests"]
